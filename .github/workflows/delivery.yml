name: Delivery v2

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      execute:
        description: Execute the delivery plan instead of compiling it only.
        required: false
        type: boolean
        default: true
      approve-stable:
        description: Approve activation for a stable 1.0+ release.
        required: false
        type: boolean
        default: false
      candidate-receipt-b64:
        description: Exact Candidate receipt for stable adapters that retain the Candidate gate.
        required: false
        type: string
        default: ""

permissions:
  actions: write
  contents: read

jobs:
  delivery:
    uses: KombiverseLabs/.github/.github/workflows/product-delivery.yml@79192214c2a2bbea8852907777c50a6ff0096c2f
    with:
      product-id: runtime-contracts
      repository-id: kombify-runtime-contracts-go
      # Bootstrap stays compile-only on push. Publication requires an explicit
      # dispatch after every coordinated consumer gate has passed.
      execute: ${{ github.event_name == 'workflow_dispatch' && inputs.execute }}
      stable-approved: ${{ github.event_name == 'workflow_dispatch' && inputs.approve-stable }}
      candidate-receipt-b64: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate-receipt-b64 || '' }}
      base-sha: ${{ github.event_name == 'push' && github.event.before || github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
